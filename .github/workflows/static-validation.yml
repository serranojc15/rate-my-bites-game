name: Static validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)

      - name: Run Mission Report tests
        run: node tests/missionReport.test.cjs

      - name: Run Sprint 4.3.1 tests
        run: node tests/sprint431.test.cjs

      - name: Verify Sprint 4.3.1 integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v0.4.3.1' index.html
          grep -q 'missionReport.css' index.html
          grep -q 'missionReport.js' index.html
          grep -q 'missionReportAnalysis.js' index.html
          grep -q 'sprint431.css' index.html
          grep -q 'sprint431.js' index.html
          grep -q 'Fresh Cases' sprint431.js
          grep -q 'Pup Voice Studio' sprint431.js
