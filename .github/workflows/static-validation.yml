name: Static validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)

      - name: Validate artwork and World Bible
        run: node scripts/validate-assets.cjs

      - name: Run Mission Report tests
        run: node tests/missionReport.test.cjs

      - name: Run Sprint 4.3.1 tests
        run: node tests/sprint431.test.cjs

      - name: Run Sprint 4.3.2 tests
        run: node tests/sprint432.test.cjs

      - name: Run Detective Progression tests
        run: node tests/progression.test.cjs

      - name: Run Sprint 4.4.1 tests
        run: node tests/sprint441.test.cjs

      - name: Run Sprint 4.4.1 polish tests
        run: node tests/sprint441Polish.test.cjs

      - name: Run Sprint 4.4.2 tests
        run: node tests/sprint442.test.cjs

      - name: Run Sprint 4.4.3 tests
        run: node tests/sprint443ReleaseNeutral.test.cjs

      - name: Run Sprint 4.4.4 tests
        run: node tests/sprint444ReleaseNeutral.test.cjs

      - name: Run Sprint 4.4.5 tests
        run: |
          # Executes every assertion from: node tests/sprint445.test.cjs
          node tests/sprint445ReleaseNeutral.test.cjs

      - name: Run Sprint 4.4.6 tests
        run: |
          # Executes every assertion from: node tests/sprint446.test.cjs
          node tests/sprint446ReleaseNeutral.test.cjs

      - name: Run Sprint 4.4.7 tests
        run: node tests/sprint447.test.cjs

      - name: Run Multi-Episode Foundation tests
        run: node tests/episodes.test.cjs

      - name: Run Sprint 3.1 tests
        run: node tests/sprint31.test.cjs

      - name: Run every test entry
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.cjs; do
            node "$test_file"
          done

      - name: Verify Sprint 4.4.7 integration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');

          const releaseSource = fs.readFileSync('release.js', 'utf8');
          const indexSource = fs.readFileSync('index.html', 'utf8');
          const sandbox = {
            window: {
              document: {
                title: '',
                body: { classList: { add() {} } },
                querySelector() { return null; },
                querySelectorAll() { return []; }
              }
            }
          };

          vm.runInNewContext(releaseSource, sandbox, { filename: 'release.js' });
          const release = sandbox.window.BiteBuddyRelease;
          assert.ok(release, 'release.js exposes BiteBuddyRelease');
          assert.match(release.version, /^v0\.4\.\d+\.\d+$/, 'authoritative release version is valid');
          assert.ok(typeof release.releaseName === 'string' && release.releaseName.trim().length > 0, 'authoritative release name is non-empty');
          assert.ok(indexSource.includes(`<title>Rate My Bites — Bite Buddy League ${release.version}</title>`), 'fallback title matches authoritative release version');
          NODE
          grep -q 'installConversationAndSuspensePolish' sprint447.js
          grep -q 'installConversationScene' sprint447.js
          grep -q 'oldLabel?.remove?.()' sprint447.js
          grep -q 'conversation-face-safe-label' sprint447.js
          grep -q 'conversation-portrait-button' sprint447.js
          grep -q 'Tap photo to continue' sprint447.js
          grep -q 'conversationAdvanceLabel' sprint447.js
          grep -q 'advanceConversationOnce' sprint447.js
          grep -q 'continueButton.onclick = activate' sprint447.js
          grep -q 'stopInteractiveControlPropagation' sprint447.js
          grep -q 'focusConversationStage' sprint447.js
          grep -q 'heading.focus?.({ preventScroll: true })' sprint447.js
          grep -q 'appRoot.scrollTo({ top, behavior: motion })' sprint447.js
          grep -q 'prefersReducedMotion() ? "auto" : "smooth"' sprint447.js
          grep -q 'STANDARD_REVEAL_DELAYS' sprint447.js
          grep -q 'REDUCED_REVEAL_DELAYS' sprint447.js
          grep -q 'incoming: 1500' sprint447.js
          grep -q 'incoming: 700' sprint447.js
          grep -q 'restaurantRevealTimer' sprint447.js
          grep -q 'restaurantScheduledKey' sprint447.js
          grep -q 'The prediction is locked.' sprint447.js
          grep -q 'Three diners. One shared table.' sprint447.js
          grep -q 'The group has chosen.' sprint447.js
          grep -q 'all 120 restaurant points' sprint447.js
          grep -q 'different restaurant this time' sprint447.js
          grep -q 'voice.settings?.enabled === false' sprint447.js
          grep -q 'stateObject.sprint447RestaurantNarratedKeys' sprint447.js
          grep -q 'stateObject.restaurantRevealNarratedStages.push("revealed")' sprint447.js
          grep -q 'conversation-scene-heading' sprint447.css
          grep -q 'conversation-tap-cue' sprint447.css
          grep -q 'conversation-portrait-button:focus-visible' sprint447.css
          grep -q 'object-position:center 18%' sprint447.css
          grep -q 'safe-area-inset-bottom' sprint447.css
          grep -q '@media(prefers-reduced-motion:reduce)' sprint447.css
          grep -q 'sprint447.css' index.html
          grep -q 'sprint447.js' index.html
          grep -q 'sprint446.css' index.html
          grep -q 'sprint446.js' index.html
          grep -q 'storyMemoryRecord(event)' livingConversations.js
          grep -q 'livingDinnerStory.events = cloneEpisodeValue(initialEpisodeDefinition.story.scenes)' directorCut.js
          grep -q 'Restaurant points' sprint441.js
          grep -q 'Continue to Order Predictions' sprint441.js
          grep -q 'dinerResultNarration' sprint446.js
          grep -q 'MISSION COMPLETE' sprint445.js
          grep -q 'Prototype preview:' groupLeaderboard.js
          grep -q 'progression.js' index.html
          grep -q 'progressionUI.js' index.html
          grep -q 'bite-buddy-progression-v1' progression.js
          grep -q 'Pup Voice Studio' sprint431.js
          grep -q 'const points = { restaurant: 120, meal: 30, drink: 20, dessert: 10 }' app.js
          ! grep -q 'speechSynthesis' sprint447.js
          ! grep -q 'awardLatestAttempt' sprint447.js
          ! grep -q 'recordAttempt(' sprint447.js
          ! grep -q 'v0.4.4.6' release.js index.html
          ! grep -Eq 'v0\.4\.[0-3]\.' release.js index.html
          ! grep -q 'MISSION_REPORT_VERSION' index.html
