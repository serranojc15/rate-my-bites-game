name: Static validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)

      - name: Run Mission Report tests
        run: node tests/missionReport.test.cjs

      - name: Run Sprint 4.3.1 tests
        run: node tests/sprint431.test.cjs

      - name: Run Sprint 4.3.2 tests
        run: node tests/sprint432.test.cjs

      - name: Run Detective Progression tests
        run: node tests/progression.test.cjs

      - name: Run Sprint 4.4.1 tests
        run: node tests/sprint441.test.cjs

      - name: Run Sprint 4.4.1 polish tests
        run: node tests/sprint441Polish.test.cjs

      - name: Run Sprint 4.4.2 tests
        run: node tests/sprint442.test.cjs

      - name: Run Sprint 4.4.3 tests
        run: node tests/sprint443.test.cjs

      - name: Run Sprint 4.4.4 tests
        run: node tests/sprint444.test.cjs

      - name: Verify Sprint 4.4.4 integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v0.4.4.4' release.js
          grep -q 'Final Reveal Continuity & Score Drama' release.js
          grep -q 'buildMissionReportData()' sprint444.js
          grep -q 'finalRevealPhase: "opening"' sprint444.js
          grep -q 'finalRevealPersonIndex' sprint444.js
          grep -q 'finalRevealShowAll' sprint444.js
          grep -q 'finalRevealSkipAnimations' sprint444.js
          grep -q 'finalRevealActionInProgress' sprint444.js
          grep -q 'finalRevealNarratedKeys' sprint444.js
          grep -q 'Restaurant score already secured.' sprint444.js
          grep -q 'No restaurant vote will be replayed.' sprint444.js
          grep -q 'report.restaurantResult.prediction' sprint444.js
          grep -q 'report.restaurantResult.actual' sprint444.js
          grep -q 'result.answers.map(answerCardMarkup)' sprint444.js
          grep -q 'calibrationLabel(answer.confidence, answer.correct)' sprint444.js
          grep -q 'result.pointsEarned} / ${result.pointsPossible}' sprint444.js
          grep -q 'revealedScoreThrough(report, state.finalRevealPersonIndex)' sprint444.js
          grep -q 'id="revealAllAnswers"' sprint444.js
          grep -q 'id="skipRevealAnimations"' sprint444.js
          grep -q 'report.categoryResults.map' sprint444.js
          grep -q 'id="viewMissionReport"' sprint444.js
          grep -q 'id="reviewEveryAnswer"' sprint444.js
          grep -q 'invokeMissionAction("#missionFreshVariant")' sprint444.js
          grep -q 'invokeMissionAction("#missionReplayEpisode")' sprint444.js
          grep -q 'final-answer-card' sprint444.css
          grep -q 'final-category-breakdown' sprint444.css
          grep -q 'final-score-monument' sprint444.css
          grep -q '@media (prefers-reduced-motion: reduce)' sprint444.css
          grep -q 'sprint444.css' index.html
          grep -q 'sprint444.js' index.html
          grep -q 'currentConfidence("group", "restaurant")' sprint442.js
          grep -q 'dock.insertBefore(confidenceBox, lockButton)' sprint442.js
          grep -q 'standalone?.remove()' sprint442.js
          grep -q 'Restaurant prediction confidence' sprint442.js
          grep -q 'Lock Restaurant Prediction' sprint441.js
          grep -q 'Continue to Order Predictions' sprint441.js
          grep -q 'restaurantRevealLockedChoice' sprint441.js
          grep -q 'working.insertAdjacentElement("afterend", dock)' sprint441Polish.js
          grep -q 'preventScroll: true' sprint441Polish.js
          grep -q 'confidenceControl(context.person.id, context.stage)' sprint443.js
          grep -q 'The deduction is sealed. The answer stays hidden until the Final Reveal.' sprint443.js
          grep -q 'Lock Final Prediction and Begin the Reveal' sprint443.js
          grep -q 'Prototype preview:' groupLeaderboard.js
          grep -q 'View Leaderboard' groupLeaderboard.js
          grep -q 'groupLeaderboardData.js' index.html
          grep -q 'groupLeaderboard.js' index.html
          grep -q 'progression.js' index.html
          grep -q 'progressionUI.js' index.html
          grep -q 'bite-buddy-progression-v1' progression.js
          grep -q 'Same-variant replay is practice' progression.js
          grep -q 'Pup Voice Studio' sprint431.js
          grep -q 'missionReportInstallVersion = applyIdentity' sprint432.js
          grep -q 'installFinalRevealVersion = applyIdentity' sprint432.js
          grep -q 'const points = { restaurant: 120, meal: 30, drink: 20, dessert: 10 }' app.js
          ! grep -q 'Where did the table go?' sprint444.js
          ! grep -q 'calculateScore();' sprint444.js
          ! grep -q 'awardLatestAttempt' sprint444.js
          ! grep -q 'recordAttempt(' sprint444.js
          ! grep -q 'v0.4.4.3' release.js index.html
          ! grep -Eq 'v0\.4\.[0-3]\.' release.js index.html
          ! grep -q 'MISSION_REPORT_VERSION' index.html
