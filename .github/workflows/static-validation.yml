name: Static validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)

      - name: Run Mission Report tests
        run: node tests/missionReport.test.cjs

      - name: Run Sprint 4.3.1 tests
        run: node tests/sprint431.test.cjs

      - name: Run Sprint 4.3.2 tests
        run: node tests/sprint432.test.cjs

      - name: Run Detective Progression tests
        run: node tests/progression.test.cjs

      - name: Run Sprint 4.4.1 tests
        run: node tests/sprint441.test.cjs

      - name: Run Sprint 4.4.1 polish tests
        run: node tests/sprint441Polish.test.cjs

      - name: Run Sprint 4.4.2 tests
        run: node tests/sprint442.test.cjs

      - name: Run Sprint 4.4.3 tests
        run: node tests/sprint443.test.cjs

      - name: Run Sprint 4.4.4 tests
        run: node tests/sprint444.test.cjs

      - name: Run Sprint 4.4.5 tests
        run: node tests/sprint445.test.cjs

      - name: Verify Sprint 4.4.5 integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v0.4.4.5' release.js
          grep -q 'Mission Report Payoff & Replay Momentum' release.js
          grep -q 'baseRenderMissionReport445' sprint445.js
          grep -q 'buildMissionReportData()' sprint445.js
          grep -q 'progressionApi.getProgression()' sprint445.js
          grep -q 'currentAward(progression, attempt)' sprint445.js
          grep -q 'groupedXpBreakdown' sprint445.js
          grep -q 'progressionBeforeAttempt' sprint445.js
          grep -q 'previousInvestigationComparison' sprint445.js
          grep -q 'detectiveDevelopment' sprint445.js
          grep -q 'nextMissionRecommendation' sprint445.js
          grep -q 'BiteBuddyGroupLeaderboard' sprint445.js
          grep -q 'captureExistingActions()' sprint445.js
          grep -q 'captureCelebrations()' sprint445.js
          grep -q 'MISSION COMPLETE' sprint445.js
          grep -q 'Case Score' sprint445.js
          grep -q 'XP Earned' sprint445.js
          grep -q 'Current Rank' sprint445.js
          grep -q 'XP Breakdown' sprint445.js
          grep -q 'Since Your Last Investigation' sprint445.js
          grep -q 'Detective Development' sprint445.js
          grep -q 'Pup’s Next Mission' sprint445.js
          grep -q 'Group Update' sprint445.js
          grep -q 'Prototype preview:' sprint445.js
          grep -q 'Practice mode · Limited XP' sprint445.js
          grep -q 'Same-case replays provide limited practice XP' sprint445.js
          grep -q 'practice credit for this variant was already awarded' sprint445.js
          grep -q 'state.finalRevealPhase = "review"' sprint445.js
          grep -q 'role="progressbar"' sprint445.js
          grep -q 'missionPayoffNarrated' sprint445.js
          grep -q 'mission-payoff-primary-metrics' sprint445.css
          grep -q 'mission-payoff-xp-list' sprint445.css
          grep -q 'mission-payoff-comparison' sprint445.css
          grep -q 'mission-payoff-development' sprint445.css
          grep -q 'mission-payoff-actions' sprint445.css
          grep -q 'env(safe-area-inset-bottom)' sprint445.css
          grep -q '@media (prefers-reduced-motion: reduce)' sprint445.css
          grep -q 'sprint445.css' index.html
          grep -q 'sprint445.js' index.html
          grep -q 'buildMissionReportData()' sprint444.js
          grep -q 'No restaurant vote will be replayed.' sprint444.js
          grep -q 'result.answers.map(answerCardMarkup)' sprint444.js
          grep -q 'id="reviewEveryAnswer"' sprint444.js
          grep -q 'currentConfidence("group", "restaurant")' sprint442.js
          grep -q 'dock.insertBefore(confidenceBox, lockButton)' sprint442.js
          grep -q 'standalone?.remove()' sprint442.js
          grep -q 'Restaurant prediction confidence' sprint442.js
          grep -q 'Lock Restaurant Prediction' sprint441.js
          grep -q 'Continue to Order Predictions' sprint441.js
          grep -q 'restaurantRevealLockedChoice' sprint441.js
          grep -q 'working.insertAdjacentElement("afterend", dock)' sprint441Polish.js
          grep -q 'preventScroll: true' sprint441Polish.js
          grep -q 'confidenceControl(context.person.id, context.stage)' sprint443.js
          grep -q 'The deduction is sealed. The answer stays hidden until the Final Reveal.' sprint443.js
          grep -q 'Lock Final Prediction and Begin the Reveal' sprint443.js
          grep -q 'Prototype preview:' groupLeaderboard.js
          grep -q 'View Leaderboard' groupLeaderboard.js
          grep -q 'groupLeaderboardData.js' index.html
          grep -q 'groupLeaderboard.js' index.html
          grep -q 'progression.js' index.html
          grep -q 'progressionUI.js' index.html
          grep -q 'bite-buddy-progression-v1' progression.js
          grep -q 'Same-variant replay is practice' progression.js
          grep -q 'Pup Voice Studio' sprint431.js
          grep -q 'missionReportInstallVersion = applyIdentity' sprint432.js
          grep -q 'installFinalRevealVersion = applyIdentity' sprint432.js
          grep -q 'const points = { restaurant: 120, meal: 30, drink: 20, dessert: 10 }' app.js
          ! grep -q 'awardAttempt(' sprint445.js
          ! grep -q 'recordAttempt(' sprint445.js
          ! grep -q 'v0.4.4.4' release.js index.html
          ! grep -Eq 'v0\.4\.[0-3]\.' release.js index.html
          ! grep -q 'MISSION_REPORT_VERSION' index.html
