<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">No dessert ordered</title>
  <desc id="description">An empty restaurant plate with a small check mark, indicating that no dessert was ordered.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#f5dfbd"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#684b2f" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="372" r="250" fill="#fffdf7" stroke="#d7b37d" stroke-width="22" filter="url(#shadow)"/>
  <circle cx="600" cy="372" r="190" fill="none" stroke="#ead4ad" stroke-width="5"/>
  <path d="m512 377 60 60 126-142" fill="none" stroke="#2e7d67" stroke-linecap="round" stroke-linejoin="round" stroke-width="34"/>
  <text x="600" y="700" fill="#4e342e" font-family="system-ui, sans-serif" font-size="64" font-weight="700" text-anchor="middle">No dessert this time</text>
</svg>
